plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'jp.appathy.sechq.clientapp'
    compileSdk 34

    defaultConfig {
        applicationId "jp.appathy.sechq.client"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            java.srcDirs = ['../app/src/main/java']
            kotlin.srcDirs = ['../app/src/main/java']
            res.srcDirs = ['../app/src/main/res', 'src/main/res']
        }
    }

    signingConfigs {
        fixed {
            storeFile file('../app/sechq.keystore')
            storePassword 'sechqpass'
            keyAlias 'sechq'
            keyPassword 'sechqpass'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.0'
    implementation 'androidx.work:work-runtime:2.9.1'
}
